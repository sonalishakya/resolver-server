<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>~ DEEP LINK GENERATOR ~</h1>
  </header>

  <main>
    <section class="controls">
      <h2>Choose a Usecase:</h2>
      <div id="template-cards" class="cards-container"></div>
      <!-- <label for="template-dropdown">Choose a Usecase:</label>
      <select id="template-dropdown">
        <option value="" disabled selected>Select</option>
      </select> -->
    </section>

    <section id="template-form">
      <h2>Template Details</h2>
      <pre id="template-content">Select a template to view its content here.</pre>
      <form id="template-fields"></form>
    </section>
  </main>

  <footer>
    <p>© 2025 ONDC Deeplink 2.0</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
